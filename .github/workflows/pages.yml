name: Deploy to GitHub Pages

on:
  push:
    # main plus the feature/fix branch being worked on: the public page always
    # shows the most recently pushed of these branches.
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Compile index_dev.html into the self-contained index.html, so the deployed page is always fresh
      - run: node build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
